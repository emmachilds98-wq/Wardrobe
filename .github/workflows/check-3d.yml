# The 3D check on every pull request that changes the page, its data or the checks themselves.
# It builds the site (which also runs the data checks in tools/build_site.py), makes sure docs/ was rebuilt,
# then renders the outfits the change touches plus a fixed spread of outfits covering every garment shape
# (tools/qa/gate.txt) on Dave's 3D model, as saved and on Edit Dave's other builds, and fails if any shows skin,
# holes, an inner layer poking through, stray parts or colour drift. The pictures of anything flagged are kept as
# the run's "qa-..." artifacts. It also reads every outfit piece as the page does (tools/specs.js) and fails when
# that differs from data/specs.json, so a change to how pieces are read is committed, and reviewed, with the change.
# How to read and fix a failure: CONTRIBUTING.md, "When the 3D check fails".
name: 3D check

on:
  pull_request:
    paths:
      - page.html
      - data/**
      - photos/**
      - docs/**
      - tools/build_site.py
      - tools/check_3d.js
      - tools/specs.js
      - tools/qa/**
      - .github/workflows/check-3d.yml
  workflow_dispatch:

# (a newer push to the same pull request replaces a run still going)
concurrency:
  group: check-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data checks and docs/ up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (runs the outfit and fixes checks)
        run: python3 tools/build_site.py --out docs
      - name: docs/ matches page.html and data/
        run: |
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ is out of date. Run: python3 tools/build_site.py --out docs, and commit docs/."
            git diff --stat -- docs | tail -20
            exit 1
          fi

  specs:
    name: Stored specs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build
        run: python3 tools/build_site.py --out "$RUNNER_TEMP/site"
      - name: Read every outfit piece
        run: node tools/specs.js --site "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/specs.json"
      - name: data/specs.json matches
        run: python3 tools/qa/specs_diff.py data/specs.json "$RUNNER_TEMP/specs.json" --ci

  render:
    name: 3D check, ${{ matrix.body }} (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Dave as saved, and Edit Dave's other builds and the loosest cloth fit, since what fits one shape can leave a
      # gap on another (tools/qa/body.js)
      matrix:
        body: [dave, slim, athletic, heavier, loose]
        shard: [0, 1, 2]
        include:
          - { shard: 0, part: 1 }
          - { shard: 1, part: 2 }
          - { shard: 2, part: 3 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build
        run: python3 tools/build_site.py --out "$RUNNER_TEMP/site"
      - name: Outfits to check
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          python3 tools/qa/changed_outfits.py "$base" --max 60 > "$RUNNER_TEMP/ids.txt"
          echo "Changed outfits: $(grep -c . "$RUNNER_TEMP/ids.txt" || true)"
          cat tools/qa/gate.txt >> "$RUNNER_TEMP/ids.txt"
      - name: Render and check
        run: node tools/check_3d.js --site "$RUNNER_TEMP/site" --ids "@$RUNNER_TEMP/ids.txt" --body ${{ matrix.body }} --shard ${{ matrix.shard }}/3 --out qa --debug --fail
      # the fitting room's "How it's worn" toggles: tucked in with turn-ups, and done up and untucked (on his saved shape)
      - name: Render and check, worn other ways
        if: matrix.body == 'dave'
        run: |
          node tools/check_3d.js --site "$RUNNER_TEMP/site" --ids "@$RUNNER_TEMP/ids.txt" --wear tuck=in,turn=up --shard ${{ matrix.shard }}/3 --out qa/wear-tuck --debug --fail
          node tools/check_3d.js --site "$RUNNER_TEMP/site" --ids "@$RUNNER_TEMP/ids.txt" --wear zip=up,tuck=out --shard ${{ matrix.shard }}/3 --out qa/wear-zip --debug --fail
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.body }}-part-${{ matrix.part }}
          path: qa/
          if-no-files-found: ignore
          retention-days: 14
